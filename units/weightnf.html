<script language="JavaScript">
<!--
////////////////

function round(n)
{
	number = new Number(n);
	return Math.round(number*1000000)/1000000;
}

function calc()
{
	var W  = new Number(document.frm.W.value);
	var WU = new Number(document.frm.WU.selectedIndex);
	var W1,W2,W3,W4,W5,W6,W7,W8;
	var grams = 0;
	
	W1=W2=W3=W4=W5=W6=W7=W8=0;
	
	// convert the weight to common gram first
	if(WU == 0) grams = W * 1000000;		// Metric Ton
	if(WU == 1) grams = W * 1000; 			// kg
	if(WU == 2) grams = W * 1; 			// g
	if(WU == 3) grams = W / 1000; 			// mg
	if(WU == 4) grams = W * 2000 * 453.6; 		// English Ton
	if(WU == 5) grams = W * 453.6; 			// lb
	if(WU == 6) grams = W * 28.35; 			// oz
	if(WU == 7) grams = W * .06481			// grains

	// convert from gram to various things
	W1 = grams /1000000;
	W2 = grams /1000;
	W3 = grams;
	W4 = grams * 1000;
	W5 = grams /(.06481);
	W6 = grams /(2000 * 453.6);
	W7 = grams /(453.6);
	W8 = grams /(28.35);

	// set the form values
	document.frm.W1.value = round(W1);
	document.frm.W2.value = round(W2);
	document.frm.W3.value = round(W3);
	document.frm.W4.value = round(W4);
	document.frm.W5.value = round(W5);
	document.frm.W6.value = round(W6);
	document.frm.W7.value = round(W7);
	document.frm.W8.value = round(W8);
}

// --></script>
