<!--

function round(n)
{
	number = new Number(n);
	return Math.round(number*100000000)/100000000;
}

function calc()
{
	var P  = new Number(document.frm.P.value);
	var PU = new Number(document.frm.PU.selectedIndex);
	var P0,P1,P2,P3,P4,P5,P6;
	var watt = 0;
	
	P0=P1=P2=P3=P4=P5=P6=0;
	
	// convert the power to common watt first
	if(PU == 0) watt = P / 10000000;	// ergs/sec
	if(PU == 1) watt = P * 1; 		// watts
	if(PU == 2) watt = P * 1; 		// joules/sec
	if(PU == 3) watt = P / .7376; 		// ft*lb/sec
	if(PU == 4) watt = P / .05689; 		// btu/min
	if(PU == 5) watt = P * 69.77; 		// kcal/min
	if(PU == 6) watt = P * 74.57; 		// hp

	// convert from watt to various units
	P0 = watt * 10000000;
	P1 = watt;
	P2 = watt;
	P3 = watt * .7376;
	P4 = watt * .05689;
	P5 = watt / 69.77;
	P6 = watt / 74.57;
	
	// set the form values
	document.frm.P0.value = round(P0);
	document.frm.P1.value = round(P1);
	document.frm.P2.value = round(P2);
	document.frm.P3.value = round(P3);
	document.frm.P4.value = round(P4);
	document.frm.P5.value = round(P5);
	document.frm.P6.value = round(P6);
}

// --></script>
