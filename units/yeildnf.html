{

{
	var lbacre  = new Number(document.frm.E.value);
	var YM;
	
	YM = lbacre / .8922;
	
	// set the form values
	document.frm.YM.value = round(YM);

	var kgha  = new Number(document.frm.M.value);

	YE = kgha / 1.121;
	
	// set the form values
	document.frm.YE.value = round(YE);
}
