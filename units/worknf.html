<!--

function round(n)
{
	number = new Number(n);
	return Math.round(number*100000000)/100000000;
}

function calc()
{
	var W  = new Number(document.frm.W.value);
	var WU = new Number(document.frm.WU.selectedIndex);
	var W0,W1,W2,W3,W4,W5;
	var kwhr = 0;
	
	W0=W1=W2=W3=W4=W5=W6=0;
	
	// convert the WORK to common kwhr first
	if(WU == 0) kwhr = W / (3413 * 100000);		// therm
	if(WU == 1) kwhr = W / (3413 * 778.3); 		// ft*lb
	if(WU == 2) kwhr = W / 3413; 			// BTU
	if(WU == 3) kwhr = W / 860; 			// kcal
	if(WU == 4) kwhr = W / 1.341; 			// hp*hr
	if(WU == 5) kwhr = W; 				// kw*hr
	

	// convert from watt to various units
	W0 = kwhr * (3413 * 100000);
	W1 = kwhr * (3413 * 778.3);
	W2 = kwhr * 3413;
	W3 = kwhr * 860;
	W4 = kwhr * 1.341;
	W5 = kwhr;
	
	// set the form values
	document.frm.W0.value = round(W0);
	document.frm.W1.value = round(W1);
	document.frm.W2.value = round(W2);
	document.frm.W3.value = round(W3);
	document.frm.W4.value = round(W4);
	document.frm.W5.value = round(W5);
}

// --></script>
