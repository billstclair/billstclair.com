<!--

function round(n)
{
	number = new Number(n);
	return Math.round(number*100)/100;
}

function calc()
{
	var H  = new Number(document.frm.H.value);
	var L  = new Number(document.frm.L.value);
	var MU = new Number(document.frm.MU.selectedIndex);
	var LU = new Number(document.frm.LU.selectedIndex);
	var V0,V1,V2;
	var hfeet = 0;
	var lfeet = 0;
	var r = 0;
	
	V0=V1=V2=0;

	//Convert height to common feet
	if(MU == 0) hfeet = H * 3.28084; 	// meters
	if(MU == 1) hfeet = H * .032808;  	// cm
	if(MU == 2) hfeet = H * 3;		// yard
	if(MU == 3) hfeet = H;			// feet
	if(MU == 4) hfeet = H * .083333;		// inches

	//Convert length to common feet
	if(MU == 0) lfeet = L * 3.28084; 	// meters
	if(MU == 1) lfeet = L * .032808;  	// cm
	if(MU == 2) lfeet = L * 3;		// yard
	if(MU == 3) lfeet = L;			// feet
	if(MU == 4) lfeet = L * .083333;		// inches
	
	// convert the length to radius first
	if(LU == 0) r = lfeet;		// radius
	if(LU == 1) r = lfeet / 2; 	// diameter

	// convert from radius to volume
	V0 = Math.PI * r * r * hfeet;
	V1 = V0 * 7.48;
	V2 = V1 * 3.79;

	// set the form values
	document.frm.V0.value = round(V0);
	document.frm.V1.value = round(V1);
	document.frm.V2.value = round(V2);
}

// --></script>
