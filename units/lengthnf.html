function round(n)
{
	number = new Number(n);
	return Math.round(number*1000000)/1000000;
}

function calc()
{
	var L  = new Number(document.frm.L.value);
	var LU = new Number(document.frm.LU.selectedIndex);
	var L1,L2,L3,L4,L5,L6;
	var meters = 0;
	
	L1=L2=L3=L4=L5=L6=L7=L8=0;
	
	// convert the weight to common gram first
	if(LU == 0) meters = L * 1000;		// km
	if(LU == 1) meters = L * 1; 		// m
	if(LU == 2) meters = L / 100; 		// cm
	if(LU == 3) meters = L / 1000; 		// mm
	if(LU == 4) meters = L * 1609.344; 	// miles
	if(LU == 5) meters = L * .9144; 	// yards
	if(LU == 6) meters = L * .3048; 	// feet
	if(LU == 7) meters = L * .0254;		// inches

	// convert from gram to various things
	L0 = meters /1000;		// km
	L1 = meters;			// m
	L2 = meters * 100;		// cm 
	L3 = meters * 1000;		// mm
	L4 = meters /(1609.344);	// miles
	L5 = meters /(.9144);		// yards
	L6 = meters /(.3048);		// feet
	L7 = meters /(.0254);		// inches

	// set the form values
	document.frm.L0.value = round(L0);
	document.frm.L1.value = round(L1);
	document.frm.L2.value = round(L2);
	document.frm.L3.value = round(L3);
	document.frm.L4.value = round(L4);
	document.frm.L5.value = round(L5);
	document.frm.L6.value = round(L6);
	document.frm.L7.value = round(L7);
}

// --></script>
