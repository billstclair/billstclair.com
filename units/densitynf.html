function round(n)
{
	number = new Number(n);
	return Math.round(number*100000000)/100000000;
}

function calc()
{
	var V  = new Number(document.frm.V.value);
	var VU = new Number(document.frm.VU.selectedIndex);
	var W0,W1;
	var l = 0;
	
	W0=W1=0;
	
	// convert the Volume to pound
	if(VU == 0) W0 = V * 62.36;	// ft^3
	if(VU == 1) W0 = V * 8.336; 	// gal
	if(VU == 2) W0 = V * 2.205;	// l
	
	// convert the Volume to kilogram
	if(VU == 0) W1 = V * 28.29;	// ft^3
	if(VU == 1) W1 = V * 3.781; 	// gal
	if(VU == 2) W1 = V * 1;		// l	

	
	
	// set the form values
	document.frm.W0.value = round(W0);
	document.frm.W1.value = round(W1);
}

// --></script>
