function round(n)
{
	number = new Number(n);
	return Math.round(number*1000000)/1000000;
}

function calc()
{
	var A  = new Number(document.frm.A.value);
	var AU = new Number(document.frm.AU.selectedIndex);
	var A0,A1,A2,A3,A4,A5,A6,A7,A8;
	var ha = 0;
	
	L1=L2=L3=L4=L5=L6=L7=L8=0;
	
	// convert the AREA to common ha first
	if(AU == 0) ha = A / .01;		// km^2
	if(AU == 1) ha = A * 1; 		// ha
	if(AU == 2) ha = A / 10000; 		// m^2
	if(AU == 3) ha = A / 100000000;		// cm^2
	if(AU == 4) ha = A / .003861; 		// miles^2
	if(AU == 5) ha = A / 2.471044; 		// acre
	if(AU == 6) ha = A / 11960.291831;	// yd^2
	if(AU == 7) ha = A / 107642.62648;	// ft^2
	if(AU == 8) ha = A / 15500538.213132;	// in^2

	// convert from ha to other units
	A0 = ha * .01;			// km
	A1 = ha;			// ha
	A2 = ha / .0001;		// m^2 
	A3 = ha * 100000000;		// cm^2
	A4 = ha * .003861;		// miles^2
	A5 = ha * 2.471044;		// acre
	A6 = ha * 11960.291831;	// yd^2
	A7 = ha * (107642.62648);	// ft^2
	A8 = ha * (15500538.213132);	// in^2

	// set the form values
	document.frm.A0.value = round(A0);
	document.frm.A1.value = round(A1);
	document.frm.A2.value = round(A2);
	document.frm.A3.value = round(A3);
	document.frm.A4.value = round(A4);
	document.frm.A5.value = round(A5);
	document.frm.A6.value = round(A6);
	document.frm.A7.value = round(A7);
	document.frm.A8.value = round(A8);
}

// --></script>
