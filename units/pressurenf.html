<script language="JavaScript">
<!--
////////////////

function round(n)
{
	number = new Number(n);
	return Math.round(number*100000000)/100000000;
}

function calc()
{
	var P  = new Number(document.frm.P.value);
	var PU = new Number(document.frm.PU.selectedIndex);
	var P0,P1,P2,P3,P4;
	var kPa = 0;
	
	P0=P1=P2=P3=P4=0;
	
	// convert the PRESSURE to common kPa first
	if(PU == 0) kPa = P;			// kPa
	if(PU == 1) kPa = P * .09797; 		// cm H2O
	if(PU == 2) kPa = P * 6.895; 		// lb/in^2
	if(PU == 3) kPa = P * .2488; 		// in H2O
	if(PU == 4) kPa = P * 2.986; 	// ft H2O
	

	// convert from watt to various units
	P0 = kPa;
	P1 = kPa / .09797;
	P2 = kPa / 6.895;
	P3 = kPa / .2488;
	P4 = kPa / 2.986;
	
	// set the form values
	document.frm.P0.value = round(P0);
	document.frm.P1.value = round(P1);
	document.frm.P2.value = round(P2);
	document.frm.P3.value = round(P3);
	document.frm.P4.value = round(P4);
}

// --></script>
