function round(n)
{
	number = new Number(n);
	return Math.round(number*100)/100;
}

function calcftoc()
{
	var F  = new Number(document.frm.F.value);
	var TC;
	
	TC = (5 / 9) * ( F - 32 );
	
	// set the form values
	document.frm.TC.value = round(TC);
	
}

function calcctof()
{
	var C  = new Number(document.frm.C.value);
	var TF;
	
	TF = ((9 / 5) * C) + 32 ;
	
	// set the form values
	document.frm.TF.value = round(TF);
}

// --></script>
