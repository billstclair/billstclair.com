<html>
<head>
<title>Muzzle Energy Computer</title>
<meta name="viewport" content="width=320">
<script language="JavaScript">
addEventListener("load", function()
{
	setTimeout(hideAddressbar, 0);
}, false);

function hideAddressbar()
{
	window.scrollTo(0, 1);
}

function calc() {
  var grains_per_lb = 7000;
  var lb_per_slug = 32.17;
  var grains_per_slug = grains_per_lb * lb_per_slug;
  var pi = 3.141592654;
  var velocity = new Number(document.mainform.velocity.value);
  var weight = new Number(document.mainform.weight.value);
  var diameter = new Number(document.mainform.diameter.value);
  var energy = 0.5 * (weight / grains_per_slug) * velocity * velocity;
  var r = diameter / 2;
  var efficacy = energy * Math.PI * r * r;
  var secdens = (weight / grains_per_lb) / (diameter * diameter);
  var jem = energy * secdens;
  document.mainform.energy.value = Math.round(energy);
  document.mainform.joule.value = Math.round(1.36 * energy);
  document.mainform.efficacy.value = Math.round(efficacy);
  document.mainform.secdens.value = round(secdens, 3);
  document.mainform.jem.value = Math.round(jem);
}

function wchg() {
  grcalc();
  ozcalc();
  calc();
}

function grchg() {
  document.mainform.weight.value = 
    round(15.429718 * document.mainform.gr.value, 2);
  ozcalc();
  calc();
}

function grcalc() {
  document.mainform.gr.value =
    round(document.mainform.weight.value / 15.429718, 3);
}

function ozchg1() {
  document.mainform.weight.value = 
    round(6999 * document.mainform.oz.value / 16, 0);
  grcalc();
}

function ozchg() {
  ozchg1();
  calc();
}

function ozcalc() {
  document.mainform.oz.value =
    round(16 * document.mainform.weight.value / 6999, 3);
}

function dchg() {
  mmcalc();
  ggcalc();
  calc();
}

function mmchg() {
  document.mainform.diameter.value =
    round(document.mainform.mm.value / 25.4, 3);
  ggcalc();
  calc();
}

function vchg() {
  mpscalc();
  calc();
}

function mmcalc() {
  document.mainform.mm.value =
    round(document.mainform.diameter.value * 25.4, 3);
}

function ggchg1() {
  document.mainform.diameter.value =
    round(Math.pow(4.648224 / document.mainform.gauge.value, 0.3333333), 3);
  mmcalc();
}

function ggchg() {
  ggchg1();
  calc();
}

function ggcalc() {
  document.mainform.gauge.value =
    round(4.648224 / Math.pow(document.mainform.diameter.value, 3), 3);
}

function mpscalc() {
  document.mainform.mps.value =
    round(0.3048 * document.mainform.velocity.value, 1)
}

function mpschg1() {
  document.mainform.velocity.value =
    round(3.281 * document.mainform.mps.value, 0)
}

function mpschg() {
  mpschg1();
  calc();
}

function revcalc() {
}

function revdens() {
}

function revjem() {
}

function jrevcalc() {
}

function round(x, places) {
  fac = Math.pow(10, places);
  return Math.round(x * fac) / fac
}

function modify(weight, velocity, diameter) {
  document.mainform.weight.value = weight
  document.mainform.velocity.value = velocity;
  document.mainform.diameter.value = diameter;
  grcalc();
  ozcalc();
  mmcalc();
  ggcalc();
  mpscalc();
  calc();
}

function shotmodify(ounces, velocity, gauge) {
  document.mainform.oz.value = ounces;
  document.mainform.velocity.value = velocity;
  document.mainform.gauge.value = gauge;
  ozchg1();
  ggchg1();
  mpscalc();
  calc();
  
}
</script>
</head>
<body onLoad="modify(150, 2820, 0.308);">
<table width="320px"><tr><td>
<form name="mainform">
<table>
<tr>
<td align="center">Weight (gr)</td>
<td align="center">(grams)</td>
<td align="center">(ounces)</td>
</tr>
<tr>
<td><input size="10" type="text" name="weight" onChange="wchg();" onKeyup="wchg();"></td>
<td><input size="10" type="text" name="gr" onChange="grchg();" onKeyup="grchg();"></td>
<td><input size="10" type="text" name="oz" onChange="ozchg();" onKeyup="ozchg();"></td>
</tr>
<tr>
<td align="center">Velocity (f/s)</td>
<td align="center">(m/s)</td>
</tr>
<tr>
<td><input size="10" type="text" name="velocity" onChange="vchg();" onKeyup="vchg();"></td>
<td><input size="10" type="text" name="mps" onchange="mpschg();" onKeyup="mpschg();"></td>
</tr>
<tr>
<td align="center">Diameter (in)</td>
<td align="center">(mm)</td>
<td align="center">(gauge)</td>
</tr>
<tr>
<td><input size="10" type="text" name="diameter" onChange="dchg();" onKeyup="dchg();"></td>
<td><input size="10" type="text" name="mm" onChange="mmchg();" onKeyup="mmchg();"></td>
<td><input size="10" type="text" name="gauge" onChange="ggchg();" onKeyup="ggchg();"></td>
<tr>
<td>&nbsp;</td>
</tr>
<tr>
<td align="center">Energy (ft lbs)</td>
<td align="center">(joules)</td>
</tr><tr>
<td><input size="10" type="text" name="energy" onChange="revcalc();" onKeyup="revcalc();"></td>
<td><input size="10" type="text" name="joule" onChange="jrevcalc();" onKeyup="jrevcalc();"></td>
</tr>
<tr>
<td align="center">Efficacy</td>
<td align="center">Sec. Dens.</td>
<td align="center">E*SD</td>
</tr>
<tr>
<td><input size="10" type="text" name="efficacy" onChange="revcalc();" onKeyup="revcalc();"></td>
<td><input size="10" type="text" name="secdens" onChange="revdens();" onKeyup="revdens();"></td>
<td><input size="10" type="text" name="jem" onChange="revjem();" onKeyup="revjem();"></td>
</tr>
</table>
</form>
